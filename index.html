<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#f1f5f9;font-family:'Segoe UI',sans-serif;min-height:100vh;padding-bottom:70px}
.header{background:#1e293b;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #3b82f6;position:sticky;top:0;z-index:50}
.header h1{font-size:1.15rem;color:#3b82f6;font-weight:700}
.notif-btn{background:none;border:none;color:white;font-size:1.4rem;position:relative;cursor:pointer;padding:5px}
.notif-badge{position:absolute;top:0;right:0;background:#ef4444;border-radius:50%;width:16px;height:16px;font-size:10px;align-items:center;justify-content:center;display:none}
.bottom-nav{position:fixed;bottom:0;width:100%;background:#1e293b;display:flex;border-top:1px solid #334155;z-index:100}
.nav-btn{flex:1;padding:10px 5px 8px;background:none;border:none;color:#64748b;font-size:0.6rem;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.nav-btn.active{color:#3b82f6}
.nav-btn .icon{font-size:1.25rem}
.tab{display:none;padding:14px}
.tab.active{display:block}
#authDiv{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:30px;gap:12px}
#authDiv.visible{display:flex}
.auth-logo{font-size:4rem}
.auth-title{font-size:2rem;font-weight:800;color:#3b82f6}
.auth-sub{color:#64748b;font-size:0.9rem;margin-bottom:10px}
.auth-input{width:100%;padding:14px;border-radius:12px;border:1px solid #334155;background:#1e293b;color:white;font-size:1rem;outline:none}
.auth-input:focus{border-color:#3b82f6}
.btn-primary{width:100%;padding:14px;border-radius:12px;border:none;background:#3b82f6;color:white;font-size:1rem;font-weight:700;cursor:pointer}
.btn-secondary{width:100%;padding:14px;border-radius:12px;border:1px solid #3b82f6;background:transparent;color:#3b82f6;font-size:1rem;font-weight:600;cursor:pointer}
.card{background:#1e293b;border-radius:14px;padding:15px;margin-bottom:12px;border:1px solid #1e3a5f}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.card-zona{font-weight:700;font-size:1rem}
.card-badge{background:#1e3a5f;color:#93c5fd;border-radius:20px;padding:3px 10px;font-size:0.75rem}
.card-info{color:#64748b;font-size:0.82rem;margin-bottom:10px}
.card-teams{display:flex;gap:8px;margin-bottom:10px}
.team-box{flex:1;background:#0f172a;border-radius:8px;padding:8px;text-align:center;font-size:0.8rem;color:#94a3b8}
.team-box b{color:#e2e8f0;font-size:1.1rem}
.card-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.btn{padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-size:0.78rem;font-weight:600}
.btn-blue{background:#3b82f6;color:white}
.btn-red{background:#ef4444;color:white}
.btn-gray{background:#334155;color:#e2e8f0}
.btn-green{background:#10b981;color:white}
.btn-yellow{background:#f59e0b;color:black}
.btn-purple{background:#8b5cf6;color:white}
.reactions{display:flex;gap:8px;margin-top:8px}
.reac-btn{background:#0f172a;border:1px solid #334155;border-radius:20px;padding:5px 12px;cursor:pointer;font-size:0.85rem;color:#94a3b8}
.reac-btn.active{border-color:#3b82f6;color:white;background:#1e3a5f}
.crear-form{background:#1e293b;border-radius:14px;padding:15px;margin-bottom:15px;border:1px solid #1e3a5f}
.crear-form h3{color:#3b82f6;margin-bottom:12px;font-size:1rem}
.form-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.form-input{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;font-size:0.9rem;outline:none}
.form-input:focus{border-color:#3b82f6}
#chatBox{position:fixed;bottom:70px;left:0;right:0;background:#1e293b;border-top:2px solid #3b82f6;z-index:99;max-height:55vh;flex-direction:column;display:none}
#chatBox.open{display:flex}
.chat-header{padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}
#mensajes{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.msg-item{background:#0f172a;border-radius:8px;padding:8px 10px;font-size:0.85rem}
.msg-user{color:#60a5fa;font-weight:700;font-size:0.72rem;margin-bottom:2px}
.chat-input-row{display:flex;gap:8px;padding:10px;border-top:1px solid #334155}
.chat-input-row input{flex:1;padding:10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;outline:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.open{display:flex}
.modal{background:#1e293b;border-radius:16px;padding:22px;width:100%;max-width:420px;border:1px solid #334155}
.modal h3{color:#3b82f6;margin-bottom:15px}
.modal input,.modal select{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;margin-bottom:10px;font-size:0.9rem;outline:none}
#mapModal{position:fixed;inset:0;background:#0f172a;z-index:300;flex-direction:column;display:none}
#mapModal.open{display:flex}
#mapContainer{flex:1;min-height:0}
.map-header{background:#1e293b;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155;flex-shrink:0}
.map-tip{background:#1e293b;padding:8px;text-align:center;color:#64748b;font-size:0.78rem;border-top:1px solid #334155;flex-shrink:0}
.section-title{font-size:1rem;font-weight:700;color:#cbd5e1;margin-bottom:12px}
.empty-state{text-align:center;color:#64748b;margin-top:40px;font-size:0.9rem;line-height:1.6}
.ranking-item{display:flex;align-items:center;gap:12px;background:#1e293b;border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid #1e3a5f}
.rank-pos{font-size:1.3rem;width:32px;text-align:center;flex-shrink:0}
.rank-info{flex:1;min-width:0}
.rank-name{font-weight:600;font-size:0.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-email{color:#64748b;font-size:0.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-rating{font-weight:700;color:#3b82f6;font-size:1rem;flex-shrink:0}
.hist-card{background:#1e293b;border-radius:10px;padding:13px;margin-bottom:8px;border-left:3px solid #3b82f6}
.rbadge{border-radius:6px;padding:2px 8px;font-size:0.72rem;font-weight:700}
.rwin{background:#064e3b;color:#34d399}
.rloss{background:#450a0a;color:#f87171}
.rpend{background:#1e3a5f;color:#93c5fd}
.notif-item{background:#1e293b;border-radius:10px;padding:13px;margin-bottom:8px;border-left:3px solid #f59e0b}
.notif-item.leida{border-left-color:#334155;opacity:0.55}
.perfil-card{background:#1e293b;border-radius:14px;padding:22px;margin-bottom:15px;text-align:center;border:1px solid #1e3a5f}
.perfil-avatar{width:82px;height:82px;background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:700;margin:0 auto 12px}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.stat-box{background:#0f172a;border-radius:10px;padding:13px;text-align:center}
.stat-num{font-size:1.5rem;font-weight:800;color:#3b82f6}
.stat-label{font-size:0.68rem;color:#64748b;margin-top:2px}
.result-final{background:#0f172a;border-radius:8px;padding:6px 10px;margin-bottom:8px;font-size:0.9rem}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authDiv">
  <div class="auth-logo">⚽</div>
  <div class="auth-title">TurnitoArg</div>
  <div class="auth-sub">Organizá tus partidos fácil</div>
  <input class="auth-input" id="email" type="email" placeholder="Email">
  <input class="auth-input" id="pass" type="password" placeholder="Contraseña (mín. 6 caracteres)">
  <button class="btn-primary" onclick="register()">Registrarse</button>
  <button class="btn-secondary" onclick="login()">Ya tengo cuenta — Ingresar</button>
</div>

<!-- APP -->
<div id="appDiv" style="display:none">
  <div class="header">
    <h1>⚽ TurnitoArg</h1>
    <button class="notif-btn" onclick="showTab('notis')">🔔<span class="notif-badge" id="notifBadge">0</span></button>
  </div>

  <div id="tabPartidos" class="tab active">
    <div class="crear-form">
      <h3>+ Crear partido</h3>
      <div class="form-row"><input class="form-input" id="zona" placeholder="📍 Zona / Cancha"></div>
      <div class="form-row">
        <input class="form-input" id="fecha" type="date">
        <input class="form-input" id="hora" type="time">
      </div>
      <div class="form-row">
        <input class="form-input" id="maxJug" type="number" placeholder="Máx jugadores" value="10" min="2" max="30">
      </div>
      <div class="form-row">
        <button class="btn btn-gray" onclick="abrirMapa()">🗺️ Ubicación</button>
        <span id="ubicLabel" style="color:#64748b;font-size:0.8rem;padding-left:10px">Sin ubicación</span>
      </div>
      <button class="btn btn-blue" onclick="crearPartido()" style="width:100%;padding:12px;border-radius:10px;font-size:0.95rem">Crear partido</button>
    </div>
    <div class="section-title">Partidos disponibles</div>
    <div id="partidos"></div>
  </div>

  <div id="tabHistorial" class="tab">
    <div class="section-title">📋 Mi historial</div>
    <div id="historialDiv"></div>
  </div>

  <div id="tabRanking" class="tab">
    <div class="section-title">🏆 Ranking global</div>
    <div id="ranking"></div>
  </div>

  <div id="tabNotis" class="tab">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="section-title" style="margin:0">🔔 Notificaciones</div>
      <button class="btn btn-gray" style="font-size:0.75rem" onclick="marcarTodasLeidas()">Marcar leídas</button>
    </div>
    <div id="notisDiv"></div>
  </div>

  <div id="tabPerfil" class="tab">
    <div class="perfil-card">
      <div class="perfil-avatar" id="perfilAvatar">👤</div>
      <div style="font-size:1.3rem;font-weight:700" id="perfilNombre">-</div>
      <div style="color:#64748b;font-size:0.8rem;margin:4px 0" id="perfilEmail"></div>
      <div style="color:#60a5fa;font-size:0.88rem" id="perfilPos"></div>
      <div class="stat-grid" id="statGrid"></div>
    </div>
    <button class="btn btn-blue" onclick="abrirEditPerfil()" style="width:100%;padding:13px;border-radius:10px;margin-bottom:10px;font-size:0.95rem">✏️ Editar perfil</button>
    <button class="btn btn-red" onclick="logout()" style="width:100%;padding:13px;border-radius:10px;font-size:0.95rem">Cerrar sesión</button>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" id="nav-partidos" onclick="showTab('partidos')"><span class="icon">⚽</span><span>Partidos</span></button>
    <button class="nav-btn" id="nav-historial" onclick="showTab('historial')"><span class="icon">📋</span><span>Historial</span></button>
    <button class="nav-btn" id="nav-ranking" onclick="showTab('ranking')"><span class="icon">🏆</span><span>Ranking</span></button>
    <button class="nav-btn" id="nav-notis" onclick="showTab('notis')"><span class="icon">🔔</span><span>Notis</span></button>
    <button class="nav-btn" id="nav-perfil" onclick="showTab('perfil')"><span class="icon">👤</span><span>Perfil</span></button>
  </div>
</div>

<!-- CHAT -->
<div id="chatBox">
  <div class="chat-header">
    <span style="color:#60a5fa;font-weight:700">💬 Chat del partido</span>
    <button class="btn btn-gray" onclick="cerrarChat()" style="padding:5px 10px">✕ Cerrar</button>
  </div>
  <div id="mensajes"></div>
  <div class="chat-input-row">
    <input id="msg" placeholder="Escribí un mensaje...">
    <button class="btn btn-blue" onclick="sendMsg()">Enviar</button>
  </div>
</div>

<!-- MAPA -->
<div id="mapModal">
  <div class="map-header">
    <span style="color:#60a5fa;font-weight:700">📍 Marcar ubicación de la cancha</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-blue" onclick="confirmarUbic()">✔ Confirmar</button>
      <button class="btn btn-gray" onclick="cerrarMapa()">✕</button>
    </div>
  </div>
  <div id="mapContainer"></div>
  <div class="map-tip">Tocá el mapa para marcar la cancha</div>
</div>

<!-- MODAL PERFIL -->
<div class="modal-bg" id="modalPerfil">
  <div class="modal">
    <h3>👤 Mi perfil</h3>
    <input id="inputNombre" placeholder="Tu nombre o apodo">
    <select id="inputPosicion">
      <option value="">Seleccioná tu posición</option>
      <option value="Arquero">🧤 Arquero</option>
      <option value="Defensor">🛡️ Defensor</option>
      <option value="Mediocampista">⚙️ Mediocampista</option>
      <option value="Delantero">⚡ Delantero</option>
    </select>
    <button class="btn-primary" onclick="guardarPerfil()" style="border-radius:10px">Guardar</button>
    <button class="btn-secondary" onclick="cerrarModal('modalPerfil')" style="margin-top:8px;border-radius:10px">Cancelar</button>
  </div>
</div>

<script>
var firebaseConfig={apiKey:"AIzaSyDIuuojNXzkSh4RR4Adwkm1uWEjUZ2aP2w",authDomain:"turnitoarg-7ace7.firebaseapp.com",projectId:"turnitoarg-7ace7",storageBucket:"turnitoarg-7ace7.firebasestorage.app",messagingSenderId:"793271454131",appId:"1:793271454131:web:f0224ce0646a2beaf363c6"};
firebase.initializeApp(firebaseConfig);
var auth=firebase.auth(),db=firebase.firestore();
var unsubMatches=null,unsubChat=null,unsubNotis=null,currentMatch=null;
var selectedLat=null,selectedLng=null,leafletMap=null,leafletMarker=null;
var pendingJoin=new URLSearchParams(window.location.search).get('join');

function showTab(name){
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  document.querySelectorAll('.nav-btn').forEach(function(b){b.classList.remove('active');});
  var key=name.charAt(0).toUpperCase()+name.slice(1);
  document.getElementById('tab'+key).classList.add('active');
  document.getElementById('nav-'+name).classList.add('active');
  if(name==='historial')cargarHistorial();
  if(name==='ranking')cargarRanking();
  if(name==='notis')cargarNotis();
  if(name==='perfil')cargarPerfil();
}
function abrirModal(id){document.getElementById(id).classList.add('open');}
function cerrarModal(id){document.getElementById(id).classList.remove('open');}

function register(){
  var e=document.getElementById('email').value,p=document.getElementById('pass').value;
  auth.createUserWithEmailAndPassword(e,p)
    .then(function(c){return db.collection('users').doc(c.user.uid).set({email:c.user.email,nombre:'',posicion:'',partidos:0,ganados:0,perdidos:0,rating:1000});})
    .then(function(){alert('¡Registrado correctamente!');})
    .catch(function(err){alert(err.message);});
}
function login(){
  var e=document.getElementById('email').value,p=document.getElementById('pass').value;
  auth.signInWithEmailAndPassword(e,p).catch(function(err){alert(err.message);});
}
function logout(){
  if(unsubMatches)unsubMatches();if(unsubChat)unsubChat();if(unsubNotis)unsubNotis();
  auth.signOut();
}

auth.onAuthStateChanged(function(user){
  if(user){
    document.getElementById('authDiv').style.display='none';
    document.getElementById('appDiv').style.display='block';
    document.getElementById('fecha').value=new Date().toISOString().split('T')[0];
    cargarPartidos();cargarNotisLive();
    if(pendingJoin){join(pendingJoin);pendingJoin=null;window.history.replaceState({},'',window.location.pathname);}
    db.collection('users').doc(user.uid).get().then(function(s){var d=s.data();if(!d||!d.nombre)abrirModal('modalPerfil');});
  } else {
    document.getElementById('authDiv').style.display='flex';
    document.getElementById('appDiv').style.display='none';
  }
});

function abrirEditPerfil(){
  db.collection('users').doc(auth.currentUser.uid).get().then(function(s){
    var d=s.data()||{};
    document.getElementById('inputNombre').value=d.nombre||'';
    document.getElementById('inputPosicion').value=d.posicion||'';
    abrirModal('modalPerfil');
  });
}
function guardarPerfil(){
  var nombre=document.getElementById('inputNombre').value.trim();
  var pos=document.getElementById('inputPosicion').value;
  if(!nombre)return alert('Ingresá tu nombre');
  db.collection('users').doc(auth.currentUser.uid).update({nombre:nombre,posicion:pos})
    .then(function(){cerrarModal('modalPerfil');cargarPerfil();});
}
function cargarPerfil(){
  if(!auth.currentUser)return;
  db.collection('users').doc(auth.currentUser.uid).get().then(function(s){
    var d=s.data()||{};
    var nombre=d.nombre||auth.currentUser.email.split('@')[0];
    document.getElementById('perfilNombre').textContent=nombre;
    document.getElementById('perfilEmail').textContent=auth.currentUser.email;
    document.getElementById('perfilPos').textContent=d.posicion?'📌 '+d.posicion:'';
    document.getElementById('perfilAvatar').textContent=nombre.charAt(0).toUpperCase();
    document.getElementById('statGrid').innerHTML=
      '<div class="stat-box"><div class="stat-num">'+(d.partidos||0)+'</div><div class="stat-label">Partidos</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+(d.ganados||0)+'</div><div class="stat-label">Ganados</div></div>'+
      '<div class="stat-box"><div class="stat-num">'+(d.rating||1000)+'</div><div class="stat-label">Rating ⭐</div></div>';
  });
}

function abrirMapa(){
  document.getElementById('mapModal').classList.add('open');
  setTimeout(function(){
    if(!leafletMap){
      leafletMap=L.map('mapContainer').setView([-34.6,-58.4],12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(leafletMap);
      leafletMap.on('click',function(e){
        if(leafletMarker)leafletMap.removeLayer(leafletMarker);
        leafletMarker=L.marker(e.latlng).addTo(leafletMap);
        selectedLat=e.latlng.lat;selectedLng=e.latlng.lng;
      });
    }
    leafletMap.invalidateSize();
  },150);
}
function confirmarUbic(){
  if(!selectedLat)return alert('Tocá el mapa para marcar una ubicación');
  var lbl=document.getElementById('ubicLabel');
  lbl.textContent='✅ Ubicación marcada';lbl.style.color='#34d399';
  cerrarMapa();
}
function cerrarMapa(){document.getElementById('mapModal').classList.remove('open');}

function crearPartido(){
  var zona=document.getElementById('zona').value.trim();
  var fecha=document.getElementById('fecha').value;
  var hora=document.getElementById('hora').value;
  var max=parseInt(document.getElementById('maxJug').value)||10;
  if(!zona||!fecha||!hora)return alert('Completá zona, fecha y hora');
  db.collection('partidos').add({
    zona:zona,fecha:fecha,hora:hora,jugadores:[auth.currentUser.uid],
    teamA:[],teamB:[],votos:[],reaccionesFuego:[],reaccionesFuerza:[],reaccionesBola:[],
    resultadoFinal:null,max:max,creador:auth.currentUser.uid,
    lat:selectedLat||null,lng:selectedLng||null
  }).then(function(){
    document.getElementById('zona').value='';document.getElementById('hora').value='';
    var lbl=document.getElementById('ubicLabel');lbl.textContent='Sin ubicación';lbl.style.color='';
    selectedLat=null;selectedLng=null;
    if(leafletMarker&&leafletMap){leafletMap.removeLayer(leafletMarker);leafletMarker=null;}
  });
}

function cargarPartidos(){
  if(unsubMatches)unsubMatches();
  unsubMatches=db.collection('partidos').orderBy('fecha').onSnapshot(function(snap){
    var div=document.getElementById('partidos');div.innerHTML='';
    if(snap.empty){div.innerHTML='<div class="empty-state">No hay partidos todavía.<br>¡Creá el primero!</div>';return;}
    snap.forEach(function(d){
      var p=d.data(),id=d.id,uid=auth.currentUser.uid;
      var estoy=p.jugadores.indexOf(uid)!==-1,lleno=p.jugadores.length>=p.max;
      var fuego=p.reaccionesFuego||[],fuerza=p.reaccionesFuerza||[],bola=p.reaccionesBola||[];
      var mapLink=p.lat?'<a href="https://maps.google.com/?q='+p.lat+','+p.lng+'" target="_blank" class="btn btn-gray">🗺️ Ver</a>':'';
      var html='<div class="card">';
      html+='<div class="card-header"><div class="card-zona">📍 '+p.zona+'</div><div class="card-badge">'+p.jugadores.length+'/'+p.max+' 👥</div></div>';
      html+='<div class="card-info">📅 '+p.fecha+' &nbsp;🕐 '+p.hora+'</div>';
      html+='<div class="card-teams"><div class="team-box">🅰️ Equipo A<br><b>'+p.teamA.length+'</b></div><div class="team-box">🅱️ Equipo B<br><b>'+p.teamB.length+'</b></div></div>';
      if(p.resultadoFinal)html+='<div class="result-final">🏁 Resultado: <b>'+p.resultadoFinal+'</b></div>';
      html+='<div class="reactions">';
      html+='<button class="reac-btn'+(fuego.indexOf(uid)!==-1?' active':'')+'" onclick="reaccionar(\''+id+'\',\'Fuego\')">🔥 '+fuego.length+'</button>';
      html+='<button class="reac-btn'+(fuerza.indexOf(uid)!==-1?' active':'')+'" onclick="reaccionar(\''+id+'\',\'Fuerza\')">💪 '+fuerza.length+'</button>';
      html+='<button class="reac-btn'+(bola.indexOf(uid)!==-1?' active':'')+'" onclick="reaccionar(\''+id+'\',\'Bola\')">⚽ '+bola.length+'</button>';
      html+='</div><div class="card-actions">';
      if(!estoy&&!lleno)html+='<button class="btn btn-blue" onclick="join(\''+id+'\')">Entrar</button>';
      if(estoy)html+='<button class="btn btn-red" onclick="leave(\''+id+'\')">Salir</button>';
      html+='<button class="btn btn-gray" onclick="equipo(\''+id+'\',\'A\')">Equipo A</button>';
      html+='<button class="btn btn-gray" onclick="equipo(\''+id+'\',\'B\')">Equipo B</button>';
      html+='<button class="btn btn-gray" onclick="abrirChat(\''+id+'\')">💬</button>';
      html+='<button class="btn btn-yellow" onclick="votar(\''+id+'\')">Votar</button>';
      html+='<button class="btn btn-green" onclick="resolver(\''+id+'\')">✅ Resolver</button>';
      html+='<button class="btn btn-purple" onclick="invitar(\''+id+'\')">🔗 Invitar</button>';
      html+=mapLink+'</div></div>';
      div.innerHTML+=html;
    });
  });
}

function reaccionar(id,tipo){
  var uid=auth.currentUser.uid,ref=db.collection('partidos').doc(id);
  ref.get().then(function(s){
    var p=s.data(),campo='reacciones'+tipo,arr=p[campo]||[],upd={};
    upd[campo]=arr.indexOf(uid)!==-1?firebase.firestore.FieldValue.arrayRemove(uid):firebase.firestore.FieldValue.arrayUnion(uid);
    ref.update(upd);
  });
}

function join(id){
  var uid=auth.currentUser.uid,ref=db.collection('partidos').doc(id);
  ref.get().then(function(s){
    var p=s.data();
    if(p.jugadores.length>=p.max)return alert('El partido está lleno');
    if(p.jugadores.indexOf(uid)!==-1)return;
    ref.update({jugadores:firebase.firestore.FieldValue.arrayUnion(uid)});
    if(p.creador!==uid){
      db.collection('users').doc(p.creador).collection('notificaciones').add({
        texto:auth.currentUser.email+' se unió a tu partido en '+p.zona,leida:false,ts:Date.now()
      });
    }
  });
}
function leave(id){
  var uid=auth.currentUser.uid;
  db.collection('partidos').doc(id).update({
    jugadores:firebase.firestore.FieldValue.arrayRemove(uid),
    teamA:firebase.firestore.FieldValue.arrayRemove(uid),
    teamB:firebase.firestore.FieldValue.arrayRemove(uid)
  });
}
function equipo(id,t){
  var uid=auth.currentUser.uid;
  db.collection('partidos').doc(id).update({
    teamA:t==='A'?firebase.firestore.FieldValue.arrayUnion(uid):firebase.firestore.FieldValue.arrayRemove(uid),
    teamB:t==='B'?firebase.firestore.FieldValue.arrayUnion(uid):firebase.firestore.FieldValue.arrayRemove(uid)
  });
}
function invitar(id){
  var url=window.location.origin+window.location.pathname+'?join='+id;
  if(navigator.share){navigator.share({title:'TurnitoArg',text:'¡Unite al partido!',url:url});}
  else{navigator.clipboard.writeText(url).then(function(){alert('¡Link copiado!');});}
}

function abrirChat(id){
  currentMatch=id;document.getElementById('chatBox').classList.add('open');
  if(unsubChat)unsubChat();
  unsubChat=db.collection('partidos/'+id+'/chat').onSnapshot(function(snap){
    var div=document.getElementById('mensajes');div.innerHTML='';
    snap.forEach(function(m){
      var d=m.data();
      div.innerHTML+='<div class="msg-item"><div class="msg-user">'+d.user+'</div>'+esc(d.text)+'</div>';
    });
    div.scrollTop=div.scrollHeight;
  });
}
function cerrarChat(){document.getElementById('chatBox').classList.remove('open');if(unsubChat){unsubChat();unsubChat=null;}}
function sendMsg(){
  var text=document.getElementById('msg').value.trim();
  if(!text||!currentMatch)return;
  db.collection('partidos/'+currentMatch+'/chat').add({user:auth.currentUser.email,text:text,ts:Date.now()});
  document.getElementById('msg').value='';
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function votar(id){
  var r=prompt('Resultado A-B (ej: 3-2)');
  if(!r)return;
  db.collection('partidos').doc(id).update({votos:firebase.firestore.FieldValue.arrayUnion({uid:auth.currentUser.uid,res:r})});
  alert('Voto registrado ✅');
}
function resolver(id){
  var ref=db.collection('partidos').doc(id);
  ref.get().then(function(s){
    var p=s.data();
    if(!p.votos||!p.votos.length)return alert('Nadie votó todavía');
    var conteo={};p.votos.forEach(function(v){conteo[v.res]=(conteo[v.res]||0)+1;});
    var best=null,max=0;for(var r in conteo){if(conteo[r]>max){max=conteo[r];best=r;}}
    if(!best||max<=p.jugadores.length/2)return alert('Sin consenso todavía (falta mayoría)');
    ref.update({resultadoFinal:best});
    var pts=best.split('-').map(Number),ganaA=pts[0]>pts[1];
    Promise.all(p.jugadores.map(function(uid){
      return db.collection('users').doc(uid).get().then(function(us){
        var u=us.data();if(!u)return;
        var esA=p.teamA.indexOf(uid)!==-1,win=(esA&&ganaA)||(!esA&&!ganaA);
        return db.collection('users').doc(uid).update({
          partidos:u.partidos+1,ganados:u.ganados+(win?1:0),
          perdidos:u.perdidos+(win?0:1),rating:u.rating+(win?15:-10)
        });
      });
    })).then(function(){alert('Resultado: '+best+'\nStats actualizadas ✅');});
  });
}

function cargarHistorial(){
  if(!auth.currentUser)return;
  var uid=auth.currentUser.uid;
  db.collection('partidos').get().then(function(snap){
    var div=document.getElementById('historialDiv');div.innerHTML='';
    var items=[];
    snap.forEach(function(d){var p=d.data();if(p.jugadores.indexOf(uid)!==-1)items.push({id:d.id,data:p});});
    if(!items.length){div.innerHTML='<div class="empty-state">No participaste en ningún partido todavía</div>';return;}
    items.forEach(function(item){
      var p=item.data,esA=p.teamA.indexOf(uid)!==-1,badge='';
      if(p.resultadoFinal){
        var pts=p.resultadoFinal.split('-').map(Number),ganaA=pts[0]>pts[1],win=(esA&&ganaA)||(!esA&&!ganaA);
        badge='<span class="rbadge '+(win?'rwin':'rloss')+'">'+(win?'✅ Victoria':'❌ Derrota')+'</span>';
      } else {badge='<span class="rbadge rpend">⏳ Pendiente</span>';}
      div.innerHTML+='<div class="hist-card"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+p.zona+'</b>'+badge+'</div>'+
        '<div style="color:#64748b;font-size:0.82rem;margin-top:5px">'+p.fecha+' · '+p.hora+' · '+p.jugadores.length+' jugadores</div>'+
        (p.resultadoFinal?'<div style="margin-top:5px;font-size:0.88rem">🏁 '+p.resultadoFinal+'</div>':'')+'</div>';
    });
  });
}

function cargarRanking(){
  db.collection('users').get().then(function(snap){
    var list=[];snap.forEach(function(u){list.push(u.data());});
    list.sort(function(a,b){return(b.rating||0)-(a.rating||0);});
    var div=document.getElementById('ranking');div.innerHTML='';
    var med=['🥇','🥈','🥉'];
    list.forEach(function(d,i){
      div.innerHTML+='<div class="ranking-item"><div class="rank-pos">'+(med[i]||(i+1))+'</div>'+
        '<div class="rank-info"><div class="rank-name">'+(d.nombre||d.email)+(d.posicion?'<span style="color:#475569;font-size:0.72rem"> · '+d.posicion+'</span>':'')+'</div>'+
        '<div class="rank-email">'+d.email+'</div></div>'+
        '<div class="rank-rating">'+(d.rating||1000)+' ⭐</div></div>';
    });
  });
}

function cargarNotisLive(){
  if(!auth.currentUser)return;
  if(unsubNotis)unsubNotis();
  unsubNotis=db.collection('users').doc(auth.currentUser.uid).collection('notificaciones').onSnapshot(function(snap){
    var n=0;snap.forEach(function(d){if(!d.data().leida)n++;});
    var badge=document.getElementById('notifBadge');
    badge.style.display=n>0?'flex':'none';badge.textContent=n;
  });
}
function cargarNotis(){
  if(!auth.currentUser)return;
  db.collection('users').doc(auth.currentUser.uid).collection('notificaciones').get().then(function(snap){
    var div=document.getElementById('notisDiv');div.innerHTML='';
    if(snap.empty){div.innerHTML='<div class="empty-state">Sin notificaciones</div>';return;}
    var items=[];snap.forEach(function(n){items.push(n.data());});
    items.sort(function(a,b){return b.ts-a.ts;});
    items.forEach(function(d){
      div.innerHTML+='<div class="notif-item'+(d.leida?' leida':'')+'"><div>'+d.texto+'</div>'+
        '<div style="color:#475569;font-size:0.72rem;margin-top:4px">'+new Date(d.ts).toLocaleDateString('es-AR')+'</div></div>';
    });
  });
}
function marcarTodasLeidas(){
  if(!auth.currentUser)return;
  db.collection('users').doc(auth.currentUser.uid).collection('notificaciones').where('leida','==',false).get()
    .then(function(snap){var b=db.batch();snap.forEach(function(n){b.update(n.ref,{leida:true});});return b.commit();})
    .then(function(){cargarNotis();});
}
</script>
